name: Manual fixed Classic TLS integration
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: classic-manual-${{ github.ref }}
  cancel-in-progress: false
jobs:
  classic:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      MOONBIT_VERSION: 0.10.14+7d59c7ec9
      RUST_LOG: error
      JAVA_TOOL_OPTIONS: -XX:ActiveProcessorCount=1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
      - uses: actions/setup-python@v5
        with:
          python-version: 3.14.6
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17.0.20+8
      - name: Install exact official SDK
        env:
          MOON_HOME: ${{ runner.temp }}/moonstomp-sdk
        run: |
          curl -fSL --max-time 60 https://cli.moonbitlang.com/install/unix.sh -o "$RUNNER_TEMP/install-moonbit.sh"
          bash "$RUNNER_TEMP/install-moonbit.sh" "$MOONBIT_VERSION"
          echo "MOON_HOME=$MOON_HOME" >> "$GITHUB_ENV"
          echo "$MOON_HOME/bin" >> "$GITHUB_PATH"
      - name: Verify exact SDK and generate bridge with one worker
        run: |
          case "$(moonc -v)" in "v${MOONBIT_VERSION} "*) ;; *) exit 1 ;; esac
          moon build bridge --target js --frozen -j 1
      - name: Verify the complete official Classic archive before extraction
        run: |
          mkdir "$RUNNER_TEMP/classic-download" "$RUNNER_TEMP/classic-home"
          cd "$RUNNER_TEMP/classic-download"
          curl -fSL --max-time 120 https://archive.apache.org/dist/activemq/6.3.2/apache-activemq-6.3.2-bin.tar.gz -o apache-activemq-6.3.2-bin.tar.gz
          sha512sum --check "$GITHUB_WORKSPACE/scripts/classic-release.sha512"
          tar -xzf apache-activemq-6.3.2-bin.tar.gz -C "$RUNNER_TEMP/classic-home"
      - name: Existing real TLS three-version matrix and receipt-loss demo, serial
        run: |
          python3 scripts/classic-run.py --home "$RUNNER_TEMP/classic-home/apache-activemq-6.3.2" --java-home "$JAVA_HOME" --output "$RUNNER_TEMP/classic-matrix" --port 62614 --processors 1 --tls > "$RUNNER_TEMP/classic-matrix-console.txt" 2> "$RUNNER_TEMP/classic-matrix-console.stderr.txt"
          python3 scripts/classic-run.py --home "$RUNNER_TEMP/classic-home/apache-activemq-6.3.2" --java-home "$JAVA_HOME" --output "$RUNNER_TEMP/classic-demo" --port 62616 --processors 1 --tls --demo > "$RUNNER_TEMP/classic-demo-console.txt" 2> "$RUNNER_TEMP/classic-demo-console.stderr.txt"
      - name: Export assertion whitelist, including failed or missing evidence
        if: always()
        run: python3 scripts/export_classic_evidence.py --matrix "$RUNNER_TEMP/classic-matrix" --demo "$RUNNER_TEMP/classic-demo" --output "$RUNNER_TEMP/classic-public"
      - name: Preserve public assertion summary only
        if: ${{ false }} # No artifact storage billing in this Draft.
        uses: actions/upload-artifact@v4
        with:
          name: classic-tls-assertions
          retention-days: 1
          path: ${{ runner.temp }}/classic-public/summary.json
      - name: Show whitelisted broker assertions without artifact storage
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/classic-public/summary.json" ]; then
            cat "$RUNNER_TEMP/classic-public/summary.json"
            cat "$RUNNER_TEMP/classic-public/summary.json" >> "$GITHUB_STEP_SUMMARY"
          fi
