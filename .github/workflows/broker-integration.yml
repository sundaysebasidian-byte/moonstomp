name: Manual fixed Classic TLS integration
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: classic-manual-${{ github.ref }}
  cancel-in-progress: false
jobs:
  classic:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      MOONBIT_VERSION: 0.10.18+6c83a7f62
      RUST_LOG: error
      JAVA_TOOL_OPTIONS: -XX:ActiveProcessorCount=1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.1
      - uses: actions/setup-python@v5
        with:
          python-version: 3.12.14
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Install exact official SDK
        env:
          MOON_HOME: ${{ runner.temp }}/moonstomp-sdk
        run: |
          python3 scripts/install-ci-sdk.py --dest "$MOON_HOME"
          echo "MOON_HOME=$MOON_HOME" >> "$GITHUB_ENV"
          echo "$MOON_HOME/bin" >> "$GITHUB_PATH"
      - name: Verify exact SDK and generate bridge with one worker
        run: |
          case "$(moonc -v)" in "v${MOONBIT_VERSION} "*) ;; *) exit 1 ;; esac
          moon build bridge --target js --frozen -j 1
      - name: Verify the complete official Classic archive before extraction
        run: |
          mkdir "$RUNNER_TEMP/classic-download" "$RUNNER_TEMP/classic-home"
          cd "$RUNNER_TEMP/classic-download"
          curl -fSL --max-time 120 https://archive.apache.org/dist/activemq/6.3.2/apache-activemq-6.3.2-bin.tar.gz -o apache-activemq-6.3.2-bin.tar.gz
          sha512sum --check "$GITHUB_WORKSPACE/scripts/classic-release.sha512"
          tar -xzf apache-activemq-6.3.2-bin.tar.gz -C "$RUNNER_TEMP/classic-home"
      - name: Existing real TLS three-version matrix and receipt-loss demo, serial
        run: |
          python3 scripts/classic-run.py --home "$RUNNER_TEMP/classic-home/apache-activemq-6.3.2" --java-home "$JAVA_HOME" --output "$RUNNER_TEMP/classic-matrix" --port 62614 --processors 1 --tls --review-ack-matrix > "$RUNNER_TEMP/classic-matrix-console.txt" 2> "$RUNNER_TEMP/classic-matrix-console.stderr.txt"
          python3 scripts/classic-run.py --home "$RUNNER_TEMP/classic-home/apache-activemq-6.3.2" --java-home "$JAVA_HOME" --output "$RUNNER_TEMP/classic-demo" --port 62616 --processors 1 --tls --demo > "$RUNNER_TEMP/classic-demo-console.txt" 2> "$RUNNER_TEMP/classic-demo-console.stderr.txt"
      - name: Real TLS heartbeat timeout and cleanup
        timeout-minutes: 2
        run: |
          python3 scripts/classic-run.py --home "$RUNNER_TEMP/classic-home/apache-activemq-6.3.2" --java-home "$JAVA_HOME" --output "$RUNNER_TEMP/classic-heartbeat" --port 62617 --processors 1 --tls --heartbeat > "$RUNNER_TEMP/classic-heartbeat-console.txt" 2> "$RUNNER_TEMP/classic-heartbeat-console.stderr.txt"
      - name: Real TLS heartbeat 1000ms positive observation and negative drop
        timeout-minutes: 2
        env:
          STOMP_HEARTBEAT_PERIOD_MS: 1000
        run: |
          python3 scripts/classic-run.py --home "$RUNNER_TEMP/classic-home/apache-activemq-6.3.2" --java-home "$JAVA_HOME" --output "$RUNNER_TEMP/classic-heartbeat1000" --port 62620 --processors 1 --tls --heartbeat > "$RUNNER_TEMP/classic-heartbeat1000-console.txt" 2> "$RUNNER_TEMP/classic-heartbeat1000-console.stderr.txt"
      - name: Short real TLS async SEND with separate receipt and cleanup
        timeout-minutes: 2
        run: |
          python3 scripts/classic-run.py --home "$RUNNER_TEMP/classic-home/apache-activemq-6.3.2" --java-home "$JAVA_HOME" --output "$RUNNER_TEMP/classic-async" --port 62619 --processors 1 --tls --async-send > "$RUNNER_TEMP/classic-async-console.txt" 2> "$RUNNER_TEMP/classic-async-console.stderr.txt"
      - name: Five-minute real TLS load with bounded resources
        timeout-minutes: 7
        run: |
          python3 scripts/bounded_run.py --seconds 380 --rss-mib 512 --output "$RUNNER_TEMP/classic-soak-resources" -- python3 scripts/classic-run.py --home "$RUNNER_TEMP/classic-home/apache-activemq-6.3.2" --java-home "$JAVA_HOME" --output "$RUNNER_TEMP/classic-soak" --port 62618 --processors 1 --tls --soak > "$RUNNER_TEMP/classic-soak-console.txt" 2> "$RUNNER_TEMP/classic-soak-console.stderr.txt"
      - name: Export assertion whitelist, including failed or missing evidence
        if: always()
        run: python3 scripts/export_classic_evidence.py --matrix "$RUNNER_TEMP/classic-matrix" --demo "$RUNNER_TEMP/classic-demo" --heartbeat "$RUNNER_TEMP/classic-heartbeat" --heartbeat1000 "$RUNNER_TEMP/classic-heartbeat1000" --soak "$RUNNER_TEMP/classic-soak" --resources "$RUNNER_TEMP/classic-soak-resources" --async-send "$RUNNER_TEMP/classic-async" --output "$RUNNER_TEMP/classic-public"
      - name: Preserve public assertion summary only
        if: ${{ false }} # No artifact storage billing in this Draft.
        uses: actions/upload-artifact@v4
        with:
          name: classic-tls-assertions
          retention-days: 1
          path: ${{ runner.temp }}/classic-public/summary.json
      - name: Show whitelisted broker assertions without artifact storage
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/classic-public/summary.json" ]; then
            cat "$RUNNER_TEMP/classic-public/summary.json"
            cat "$RUNNER_TEMP/classic-public/summary.json" >> "$GITHUB_STEP_SUMMARY"
          fi
