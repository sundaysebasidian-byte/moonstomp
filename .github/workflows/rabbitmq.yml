name: RabbitMQ STOMP interop
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rabbitmq:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      MOONBIT_VERSION: 0.10.14+7d59c7ec9
      RABBITMQ_IMAGE: rabbitmq:4.1
      STOMP_PORT: 61613
      STOMP_LOGIN: moonstomp-test
      STOMP_PASSCODE: loopback-test-only
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
      - name: Install exact official SDK
        env:
          MOON_HOME: ${{ runner.temp }}/moonstomp-sdk
        run: |
          curl -fSL --max-time 60 https://cli.moonbitlang.com/install/unix.sh -o "$RUNNER_TEMP/install-moonbit.sh"
          bash "$RUNNER_TEMP/install-moonbit.sh" "$MOONBIT_VERSION"
          echo "MOON_HOME=$MOON_HOME" >> "$GITHUB_ENV"
          echo "$MOON_HOME/bin" >> "$GITHUB_PATH"
      - name: Build the JS bridge
        run: |
          case "$(moonc -v)" in "v${MOONBIT_VERSION} "*) ;; *) exit 1 ;; esac
          moon build bridge --target js --frozen -j 1
      - name: Start RabbitMQ with the STOMP plugin on loopback
        run: |
          echo '[rabbitmq_stomp].' > "$RUNNER_TEMP/enabled_plugins"
          docker run -d --name rabbitmq -p 127.0.0.1:${STOMP_PORT}:61613 \
            -e RABBITMQ_DEFAULT_USER="$STOMP_LOGIN" -e RABBITMQ_DEFAULT_PASS="$STOMP_PASSCODE" \
            -v "$RUNNER_TEMP/enabled_plugins:/etc/rabbitmq/enabled_plugins:ro" "$RABBITMQ_IMAGE"
          for i in $(seq 1 60); do
            if docker exec rabbitmq rabbitmq-diagnostics -q check_port_listener 61613 >/dev/null 2>&1; then break; fi
            sleep 2
          done
          docker exec rabbitmq rabbitmq-diagnostics -q check_port_listener 61613
          echo "RABBITMQ_VERSION=RabbitMQ $(docker exec rabbitmq rabbitmqctl -q version)" >> "$GITHUB_ENV"
      - name: STOMP 1.0/1.1/1.2, binary, transactions, NACK, heartbeat, async SEND
        run: node scripts/rabbitmq-interop-test.cjs
      - name: Broker log on failure
        if: failure()
        run: docker logs rabbitmq | tail -100
