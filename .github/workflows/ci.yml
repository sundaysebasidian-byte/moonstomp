name: MoonSTOMP checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  js-and-core:
    runs-on: ubuntu-latest
    env:
      MOONBIT_VERSION: 0.10.14+7d59c7ec9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
      - uses: actions/setup-python@v5
        with:
          python-version: 3.14.6
      - name: Install the pinned official MoonBit SDK
        env:
          MOON_HOME: ${{ runner.temp }}/moonstomp-sdk
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh -o "$RUNNER_TEMP/install-moonbit.sh"
          bash "$RUNNER_TEMP/install-moonbit.sh" "$MOONBIT_VERSION"
          echo "MOON_HOME=$MOON_HOME" >> "$GITHUB_ENV"
          echo "$MOON_HOME/bin" >> "$GITHUB_PATH"
      - name: Check build test examples differential and local TCP lifecycle
        run: python3 scripts/verify.py --output "$RUNNER_TEMP/moonstomp-evidence" --transport
      - name: Preserve evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: moonstomp-evidence
          path: ${{ runner.temp }}/moonstomp-evidence
