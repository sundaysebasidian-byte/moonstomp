name: MoonSTOMP checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  js-and-core:
    runs-on: ubuntu-latest
    env:
      MOONBIT_VERSION: 0.10.18+6c83a7f62
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.1
      - uses: actions/setup-python@v5
        with:
          python-version: 3.12.14
      - name: Install the pinned official MoonBit SDK
        env:
          MOON_HOME: ${{ runner.temp }}/moonstomp-sdk
        run: |
          python3 scripts/install-ci-sdk.py --dest "$MOON_HOME"
          echo "MOON_HOME=$MOON_HOME" >> "$GITHUB_ENV"
          echo "$MOON_HOME/bin" >> "$GITHUB_PATH"
      - name: Check build test examples differential and local TCP lifecycle
        run: python3 scripts/verify.py --output "$RUNNER_TEMP/moonstomp-evidence" --transport
      - name: Preserve evidence even on failure
        if: ${{ false }} # No artifact storage billing in this Draft.
        uses: actions/upload-artifact@v4
        with:
          name: moonstomp-evidence
          path: ${{ runner.temp }}/moonstomp-evidence
      - name: Validation status summary without artifact storage
        if: always()
        run: |
          python3 - <<'PYCODE'
          import json, os
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP'])
          names = ['moonabnf-evidence/summary.json', 'protocol-record-evidence/summary.json'] if 'moonabnf' in os.environ['GITHUB_REPOSITORY'].lower() else ['moonstomp-evidence/verification.json']
          rows = []
          for name in names:
              path = root / name
              if path.is_file():
                  d = json.loads(path.read_text())
                  rows.append({'name': name, 'status': d.get('status', d.get('overall')), 'commands': [{'name': r['name'], 'exit_code': r.get('exit_code'), 'status': r.get('status')} for r in d.get('commands', d.get('stages', []))]})
          text = json.dumps(rows, indent=2)
          print(text)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as stream: stream.write('```json\n' + text + '\n```\n')
          PYCODE
